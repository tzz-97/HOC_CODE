<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việc cần làm</title>
    <style>
        * {
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            padding: 32px 16px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f2f5;
            color: #1f2937;
        }

        .app {
            max-width: 480px;
            margin: 40px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #2563eb;
            text-align: center;
            font-size: 28px;
        }

        .task-form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #taskList {
            list-style: none;
            margin: 20px 0 0;
            padding: 0;
        }

        #taskList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        .done .task-text {
            color: #6b7290;
            text-decoration: line-through;
        }

        .delette-btn {
            flex-shrink: 0;
            padding: 8px 10px;
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .emty-message {
            margin-top: 20px;
            color: #6b7280;
            text-align: center;
        }

        @media (max-width: 400px) {
            .app {
                padding: 18px;
            }
            h1 {
                font-size: 24px;
            }
            .task-form button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <h1>Việc cần làm</h1>
        <form id="taskForm" class="task-form">
            <input 
                id="taskInput"
                type="text"
                placeholder="Nhập công việc..."
                aria-label="Công việc cần thêm"
                autocomplete="off"
            > 
           
            <button type="submit">Thêm</button>  
        </form>  
        <p id="emptyMessage" class="empty-message">
            Chưa có công việc nào.
        </p>

        <ul id="taskList"></ul>
    </main>
    <script>
        const form = document.getElementById("taskForm");
        const input = document.getElementById("taskInput");
        const list = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");

        function updateEmptyMessage() {
            emptyMessage.hidden = list.children.length > 0;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = input.value.trim();

            if (text === ""){
                input.focus();
                return;
            }
            const item = document.createElement("li");
            const taskText = document.createElement("span");
            const deleteButton = document.createElement("button");

            taskText.className = "task-text";
            taskText.textContent = text;

            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Xóa";
            deleteButton.setAttribute("aria-label", "Xóa: " + text);

            taskText.addEventListener("click", function () {
                item.classList.toggle("done");
            });

            deleteButton.addEventListener("click", function () {
                item.remove();
                updateEmptyMessage();
            });

            item.appendChild(taskText);
            item.appendChild(deleteButton);
            list.appendChild(item);

            input.value = "";
            input.focus();

            updateEmptyMessage();
        });

        updateEmptyMessage();
    </script>
</body>
</html>
